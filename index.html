<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Event Management</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B3866">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Event Mgmt">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #0B3866;
  }
  #appFrame {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
  }
  #loadingScreen {
    position: fixed;
    inset: 0;
    background: #0B3866;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    z-index: 10;
    transition: opacity 0.3s ease;
  }
  #loadingScreen.hide {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div>Loading Event Management...</div>
</div>

<iframe
  id="appFrame"
  src="https://script.google.com/a/macros/vama.app/s/AKfycbyXraOdhV8eIdIH5rM8P1seWkGV6YvkISq0FCnOCyiIg0VXo2kJecfH2IWJIqhehx8t/exec"
  allow="camera; microphone"
></iframe>

<script>
  var frame = document.getElementById('appFrame');
  var loading = document.getElementById('loadingScreen');
  frame.addEventListener('load', function () {
    loading.classList.add('hide');
  });
  // Fallback: hide the loading screen after 6s even if the load event
  // doesn't fire reliably (cross-origin iframes sometimes don't report it).
  setTimeout(function () { loading.classList.add('hide'); }, 6000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.log('Service worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
